name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      DERIVED_DATA_PATH: ${{ runner.temp }}/GameSpotDerivedData

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Game Spot.xcodeproj" \
            -scheme "Game Spot"

      - name: Select an iPhone simulator
        shell: bash
        run: |
          set -euo pipefail

          simulator_udid="$(
            xcrun simctl list devices available --json | python3 -c '
          import json
          import sys

          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          '
          )"

          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_udid" -b

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "Game Spot.xcodeproj" \
            -scheme "Game Spot" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RUNNER_TEMP/GameSpot-UnitTests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:'Game SpotTests' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run deterministic UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "Game Spot.xcodeproj" \
            -scheme "Game Spot" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RUNNER_TEMP/GameSpot-UITests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:'Game SpotUITests/ContentStateFlowUITests' \
            -only-testing:'Game SpotUITests/LocationPermissionUITests' \
            -only-testing:'Game SpotUITests/TeamActionFlowUITests' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release configuration
        run: |
          set -o pipefail
          xcodebuild build \
            -project "Game Spot.xcodeproj" \
            -scheme "Game Spot" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamespot-test-results
          path: ${{ runner.temp }}/GameSpot-*.xcresult
          if-no-files-found: ignore
          retention-days: 7
